<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Pindan</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffdd00' stroke='%23000' stroke-width='6'/%3E%3Ctext x='50' y='68' font-family='Impact,sans-serif' font-size='52' font-weight='900' text-anchor='middle' fill='%23000'%3EP%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pop-yellow: #ffdd00;
      --pop-pink: #ff69b4;
      --pop-blue: #00bfff;
      --pop-black: #000;
      --pop-white: #fff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--pop-yellow);
      background-image:
        radial-gradient(circle, rgba(255, 0, 0, 0.15) 1.2px, transparent 1.2px),
        radial-gradient(circle, rgba(0, 0, 0, 0.85) 1.2px, transparent 1.2px);
      background-size: 16px 16px, 16px 16px;
      background-position: 8px 8px, 0 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--pop-black);
      padding: 24px;
    }
    .box {
      background: var(--pop-white);
      border: 6px solid var(--pop-black);
      box-shadow: 12px 12px 0 var(--pop-black);
      padding: 56px 40px;
      max-width: 540px;
      text-align: center;
    }
    h1 {
      font-family: "Bangers", "Impact", sans-serif;
      font-size: 96px;
      margin: 0 0 12px;
      letter-spacing: 0.04em;
      color: var(--pop-pink);
      text-shadow: 4px 4px 0 var(--pop-black);
    }
    h2 {
      font-family: "Impact", sans-serif;
      font-size: 28px;
      margin: 0 0 16px;
      letter-spacing: 0.04em;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: var(--pop-blue);
      color: var(--pop-white);
      border: 4px solid var(--pop-black);
      box-shadow: 6px 6px 0 var(--pop-black);
      font-family: "Impact", sans-serif;
      font-size: 16px;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: transform 150ms;
    }
    a:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 var(--pop-black);
    }
    a:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--pop-black);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>PAGE NOT FOUND</h2>
    <p>页面找不到了，要不回首页再看看？</p>
    <a href="./">回到首页 →</a>
  </div>
</body>
</html>
